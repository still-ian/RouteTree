<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up — RouteTree.ai</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<nav class="top">
  <a class="brand" href="/">Route<span>Tree</span>.ai</a>
  <div class="links"><a href="/login.html">Log in</a></div>
</nav>

<div class="wrap" style="max-width:420px;padding-top:60px;">
  <div class="card">
    <h2>Create your account</h2>
    <div class="error-box" id="errBox"></div>
    <form id="signupForm">
      <div class="field">
        <label>Name</label>
        <input type="text" id="displayName" placeholder="Coach Smith" required>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" minlength="6" required>
      </div>
      <button class="btn" type="submit" style="width:100%;" id="submitBtn">Create account</button>
    </form>
    <p class="dim" style="margin-top:16px;">Already have an account? <a href="/login.html">Log in</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/js/supabaseClient.js"></script>
<script>
document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errBox = document.getElementById('errBox');
  errBox.classList.remove('show');
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Creating account...';

  const displayName = document.getElementById('displayName').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const { data, error } = await window.supabaseClient.auth.signUp({
    email, password,
    options: { data: { display_name: displayName } }
  });

  if (error) {
    errBox.textContent = error.message;
    errBox.classList.add('show');
    btn.disabled = false; btn.textContent = 'Create account';
    return;
  }

  if (data.session) {
    window.location.href = '/dashboard.html';
  } else {
    errBox.textContent = 'Check your email to confirm your account, then log in.';
    errBox.classList.add('show');
    btn.disabled = false; btn.textContent = 'Create account';
  }
});
</script>
</body>
</html>
